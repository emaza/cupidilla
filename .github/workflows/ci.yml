name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: cupidilla
          POSTGRES_PASSWORD: ci-password-no-secret
          POSTGRES_DB: cupidilla_test
          TZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U cupidilla -d cupidilla_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
          --health-start-period 5s
      mailpit:
        image: axllent/mailpit:v1.32.0
        env:
          MP_MAX_MESSAGES: 500
          TZ: UTC
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
          --health-start-period 5s
    env:
      # Valores de prueba: solo existen dentro de este job efímero.
      TEST_DATABASE_URL: postgres://cupidilla:ci-password-no-secret@127.0.0.1:5432/cupidilla_test
      E2E_DATABASE_URL: postgres://cupidilla:ci-password-no-secret@127.0.0.1:5432/cupidilla_e2e
      DATABASE_URL: postgres://cupidilla:ci-password-no-secret@127.0.0.1:5432/cupidilla
      INTERNAL_API_KEY: ci-internal-api-key-0123456789abcdefghij
      PUBLIC_WEB_URL: http://localhost:5173
      SMTP_URL: smtp://127.0.0.1:1025
      API_URL: http://127.0.0.1:3001
      SESSION_TTL_DAYS: '30'
      RATE_LIMIT_FACTOR: '1'
      LOG_FORMAT: json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # La base cupidilla_test ya la crea el servicio; la de los e2e hay que crearla (reset-db y
      # migrate las vacían y migran después, en cada suite).
      - name: Crear la base de los e2e
        run: psql "postgres://cupidilla:ci-password-no-secret@127.0.0.1:5432/postgres" -c "CREATE DATABASE cupidilla_e2e"

      - run: npm test

      - name: Versión de Playwright
        id: playwright
        run: echo "version=$(npm ls @playwright/test --workspace @cupidilla/web --depth=0 --parseable --long | head -1 | sed 's/.*@//')" >> "$GITHUB_OUTPUT"

      - name: Caché de los navegadores de Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Instalar Chromium (con dependencias del sistema)
        run: npx playwright install --with-deps chromium

      # No se usa `npm run test:e2e` de la raíz: su `mail:up` levanta Mailpit con docker compose
      # y aquí ya corre como servicio.
      - name: Pruebas e2e
        run: npm run build:contracts && npm run test:e2e -w @cupidilla/web
        env:
          CI: '1'

      - name: Informe y trazas de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
