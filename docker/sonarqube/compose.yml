# SonarQube local bajo demanda (npm run sonar:up). Aparte del compose de desarrollo:
# no comparte base de datos ni red con él. Necesita vm.max_map_count >= 524288 en el host.
# Las credenciales de su Postgres son solo de uso local: la base no publica ningún puerto.
name: cupidilla-sonar
services:
  sonar-db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar-local-only
      POSTGRES_DB: sonar
      TZ: UTC
    volumes:
      - sonar_db:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U sonar -d sonar']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
  sonarqube:
    image: sonarqube:26.11.0.134175-community
    depends_on:
      sonar-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar-local-only
    ports:
      - '127.0.0.1:9000:9000'
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fs http://127.0.0.1:9000/api/system/status | grep -q "\"status\":\"UP\""',
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
volumes:
  sonar_db:
  sonar_data:
  sonar_extensions:
  sonar_logs:
