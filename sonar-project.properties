# Configuración de SonarQube compartida por SonarQube Cloud (CI) y el SonarQube local.
# SonarQube Cloud:
sonar.organization=emaza
sonar.projectKey=emaza_cupidilla
# En local, scripts/sonar-scan.sh fija projectKey=cupidilla y anula la organización.
sonar.projectName=cupidilla

sonar.sources=apps/api/src,apps/web/src,packages/contracts/src,packages/fake-oauth-provider/src
sonar.tests=apps/api/test,apps/web/tests
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.e2e.ts
sonar.exclusions=**/*.spec.ts,**/*.test.ts,**/*.d.ts,**/dist/**,**/build/**,**/.svelte-kit/**,**/drizzle/**,**/node_modules/**,**/coverage/**
sonar.coverage.exclusions=**/*.spec.ts,**/*.test.ts,**/*.d.ts

sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info,apps/web/coverage/lcov.info,packages/contracts/coverage/lcov.info,packages/fake-oauth-provider/coverage/lcov.info
sonar.sourceEncoding=UTF-8

# Falsos positivos revisados (no se marcan en el servidor para que valga igual en local y en Cloud):
# - S2068: claves de traducción que contienen «contrasena», no contraseñas.
# - S5332: el transporte SMTP exige TLS salvo en loopback (ver smtp.mailer.ts).
# - PageWithoutTitleCheck: en SvelteKit el <title> lo pone cada página con <svelte:head>.
sonar.issue.ignore.multicriteria=pwd,smtp,title
sonar.issue.ignore.multicriteria.pwd.ruleKey=typescript:S2068
sonar.issue.ignore.multicriteria.pwd.resourceKey=apps/web/src/lib/errors/messages.ts
sonar.issue.ignore.multicriteria.smtp.ruleKey=typescript:S5332
sonar.issue.ignore.multicriteria.smtp.resourceKey=apps/api/src/mail/smtp.mailer.ts
sonar.issue.ignore.multicriteria.title.ruleKey=Web:PageWithoutTitleCheck
sonar.issue.ignore.multicriteria.title.resourceKey=apps/web/src/app.html
