name: cupidilla
services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cupidilla}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-cupidilla}
      TZ: UTC
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
  # Correo en local y en los e2e (correo §8.2): SMTP en 1025 y bandeja en http://localhost:8025.
  # Usa el HEALTHCHECK de la imagen. Sin volumen: los correos se pierden al recrear el contenedor.
  mail:
    image: axllent/mailpit:v1.32.0
    environment:
      MP_MAX_MESSAGES: 500
      TZ: UTC
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025'
volumes:
  pgdata:
